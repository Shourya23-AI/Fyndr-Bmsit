name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          # Firebase web settings are public by design (they identify the project, they are not secrets).
          VITE_FIREBASE_API_KEY: AIzaSyAqwaqVOx8w7flvIhatGIFXQPn5Lx-ey-k
          VITE_FIREBASE_AUTH_DOMAIN: fyndr-bmsit.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: fyndr-bmsit
          VITE_FIREBASE_APP_ID: 1:983465835584:web:0ce598c3238a6e8bfff3a5
          # Address of your hosted Fyndr server (no trailing slash). Leave empty if you have none yet.
          VITE_API_BASE: ''
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
